<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gestion médicaments</title>
</head>

<body>


<h1>Gestion des médicaments</h1>


<a href="/admin/medicaments/add">
Ajouter médicament
</a>


<br><br>


<table border="1">


<tr>

<th>ID</th>
<th>Nom</th>
<th>Prix</th>
<th>Stock</th>
<th>Action</th>

</tr>



<tr th:each="m : ${medicaments}">


<td th:text="${m.id}"></td>

<td th:text="${m.nom}"></td>

<td th:text="${m.prix}"></td>

<td th:text="${m.stock}"></td>


<td>

<a th:href="@{/admin/medicaments/delete/{id}(id=${m.id})}">
Supprimer
</a>

</td>


</tr>


</table>


<br>


<a href="/admin">
Retour Admin
</a>


</body>

</html>
