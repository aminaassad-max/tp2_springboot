<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Gestion utilisateurs</title>
</head>

<body>

<h1>Gestion des utilisateurs</h1>


<a href="/admin/users/add">
    Ajouter un utilisateur
</a>


<br><br>


<table border="1">

<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Role</th>
    <th>Action</th>
</tr>


<tr th:each="u : ${users}">

    <td th:text="${u.id}"></td>

    <td th:text="${u.username}"></td>

    <td th:text="${u.role != null ? u.role.name : 'Aucun role'}"></td>


    <td>
        <a th:href="@{/admin/users/delete/{id}(id=${u.id})}">
            Supprimer
        </a>
    </td>

</tr>


</table>


<br>


<a href="/admin">
    Retour Admin
</a>


</body>

</html>
